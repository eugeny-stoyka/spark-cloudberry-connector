# test stand: Spark on the YARN and HDFS of the stand (client mode). A run sets its own --master,
# --num-executors, --executor-cores (the regression: local[N] and YARN 1 x 2 / 2 x 2).
spark.master                          yarn
spark.submit.deployMode               client
# client mode: a second ApplicationMaster attempt has no driver to connect to
spark.yarn.maxAppAttempts             1
# the jars of Spark are put into HDFS beforehand (scripts/cluster-init.sh), otherwise every run uploads ~300 MB
spark.yarn.archive                    hdfs://namenode:8020/apps/spark/spark-jars.zip

spark.yarn.am.memory                  512m
spark.driver.memory                   1g
spark.executor.memory                 1g
spark.executor.cores                  2
spark.executor.instances              2
# a fixed number of executors: the connector plans its partitions by the task slots
spark.dynamicAllocation.enabled       false
# no Hive metastore on the stand (Spark would create a Derby one in the working directory)
spark.sql.catalogImplementation       in-memory

# Spark History Server (service spark-history): the event log of every application in HDFS
spark.eventLog.enabled                true
spark.eventLog.dir                    hdfs://namenode:8020/spark-history
spark.history.fs.logDirectory         hdfs://namenode:8020/spark-history
spark.yarn.historyServer.address      spark-history:18080
