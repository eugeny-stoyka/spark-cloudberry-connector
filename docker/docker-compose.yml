# Test stand of the connector: HDFS + YARN + Spark 3.5.8 (client, History Server) + Cloudberry 2.1, and
# the build of the connector in a Maven container. Run through docker/run.sh (README.md here).
# The data of the stand lives only in the containers: a stand from cluster up keeps it until cluster down.
# Names (project, network, image) are its own. The web UIs are published on the host with the same ports
# as in the containers: their pages link to each other by container names (resourcemanager:8088,
# nodemanager:8042, ...), docker/run.sh hosts add points the names to 127.0.0.1. Another stand with the
# same ports cannot run at the same time.
name: scc-stand

x-stand: &stand
  image: scc-stand:local
  init: true
  networks: [scc-stand]
  environment:
    YARN_NM_MEMORY_MB: ${YARN_NM_MEMORY_MB}
    YARN_NM_VCORES: ${YARN_NM_VCORES}
    YARN_CONTAINER_MAX_MB: ${YARN_CONTAINER_MAX_MB}

services:
  # --- HDFS ------------------------------------------------------------------------------
  namenode:
    <<: *stand
    # the image of the stand is built here (the first service every other one waits for)
    build:
      context: .
      args:
        HADOOP_VERSION: ${HADOOP_VERSION}
        SPARK_VERSION: ${SPARK_VERSION}
        POSTGRES_JDBC_VERSION: ${POSTGRES_JDBC_VERSION}
    hostname: namenode
    command: ["namenode"]
    ports: ["9870:9870"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9870/jmx?qry=Hadoop:service=NameNode,name=NameNodeStatus' | grep -q active"]
      interval: 5s
      retries: 60

  datanode:
    <<: *stand
    hostname: datanode
    command: ["datanode"]
    # the DataNode UI: the "download / view a file" links of the NameNode UI lead to it
    ports: ["9864:9864"]
    depends_on:
      namenode: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9864/ >/dev/null"]
      interval: 5s
      retries: 60

  # one-off preparation of HDFS: directories, the Spark jars for YARN
  cluster-init:
    <<: *stand
    command: ["cluster-init"]
    depends_on:
      datanode: {condition: service_healthy}
    restart: "no"

  # --- YARN ------------------------------------------------------------------------------
  resourcemanager:
    <<: *stand
    hostname: resourcemanager
    command: ["resourcemanager"]
    ports: ["8088:8088"]
    depends_on:
      namenode: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/ws/v1/cluster/info >/dev/null"]
      interval: 5s
      retries: 60

  nodemanager:
    <<: *stand
    hostname: nodemanager
    command: ["nodemanager"]
    ports: ["8042:8042"]
    depends_on:
      resourcemanager: {condition: service_healthy}
      cluster-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8042/ws/v1/node/info | grep -q '\"nodeHealthy\":true'"]
      interval: 5s
      retries: 60

  # Spark History Server: finished applications (jobs, stages, tasks, SQL plans) by the event log in HDFS
  spark-history:
    <<: *stand
    hostname: spark-history
    command: ["spark-history"]
    ports: ["18080:18080"]
    depends_on:
      cluster-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:18080/api/v1/version >/dev/null"]
      interval: 5s
      retries: 60

  # --- Cloudberry -------------------------------------------------------------------------
  # Cloudberry 2.1 (woblerr/cloudberry, PostgreSQL 14) in one container: the coordinator and CLOUDBERRY_SEGMENTS
  # primary segments (.env, 4; a change re-initializes the cluster — the data of the container is gone),
  # database cloudberry, gpadmin / gpadmin.
  # cloudberry:5432 — for the containers of the stand, localhost:15433 — from the host
  cloudberry:
    image: woblerr/cloudberry:${CLOUDBERRY_VERSION}
    hostname: cloudberry
    ports: ["15433:5432"]
    shm_size: 2g
    # the start script of the image with CLOUDBERRY_SEGMENTS primary segments (it has 2 written in it)
    command: ["bash", "/stand/cloudberry-start.sh"]
    environment:
      CLOUDBERRY_PASSWORD: gpadmin
      CLOUDBERRY_DATABASE_NAME: cloudberry
      CLOUDBERRY_SEGMENTS: ${CLOUDBERRY_SEGMENTS}
    # the image does chown of the scripts directory — for a read-only file only a message in the log
    volumes:
      - ./config/cloudberry/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./scripts/cloudberry-start.sh:/stand/cloudberry-start.sh:ro
      # the test data of the stand (data/README.md): COPY ... FROM '/testdata/...'; not /data — the data
      # directory of the image (coordinator, segments)
      - ./data:/testdata:ro
    healthcheck:
      # ready when the init script has run (the schema is there): the image runs it after the database
      # starts answering
      test: ["CMD-SHELL", "su - gpadmin -c \"psql -d cloudberry -tAc \\\"select 1 from pg_namespace where nspname = 'test'\\\"\" | grep -q 1"]
      interval: 10s
      start_period: 120s
      retries: 60
    networks: [scc-stand]

  # --- tools (docker compose run) ----------------------------------------------------------
  # client of the stand: spark-shell, spark-submit, hdfs, yarn; the regression runs its probes here
  #   docker compose run --rm client bash
  client:
    <<: *stand
    profiles: [tools]
    hostname: client
    command: ["bash"]
    volumes:
      - ..:/src:ro
      # the connector jars (docker/run.sh jar or a local build)
      - ../target:/scc:ro
      # the test data of the stand (data/README.md)
      - ./data:/testdata:ro
    depends_on:
      nodemanager: {condition: service_healthy}
      cloudberry: {condition: service_healthy}

  # the build of the connector from a copy of the sources, the jars go to target/ (docker/run.sh jar)
  maven:
    image: ${MAVEN_IMAGE}
    profiles: [tools]
    entrypoint: ["bash", "/src/docker/scripts/build-jar.sh"]
    command: []
    volumes:
      - ..:/src:ro
      - ../target:/out
      - maven-repo:/root/.m2

networks:
  scc-stand:
    name: scc-stand

volumes:
  # the Maven repository of the builds (dependencies are downloaded once)
  maven-repo:
    name: scc-stand-maven-repo
